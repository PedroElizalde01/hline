name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-version:
    name: verify tag matches Cargo.toml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check tag against Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)"
          if [[ "${TAG#v}" != "${CARGO_VERSION}" ]]; then
            echo "Tag ${TAG} does not match Cargo.toml version ${CARGO_VERSION}." >&2
            echo "Bump Cargo.toml (and Cargo.lock) before tagging, or retag." >&2
            exit 1
          fi

  build:
    name: build ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release archive
        run: TARGET_TRIPLE="${{ matrix.target }}" ./scripts/release_local.sh

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    name: publish release
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* \
              --verify-tag \
              --title "${TAG}" \
              --generate-notes
          fi
