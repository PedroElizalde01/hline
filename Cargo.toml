[package]
name = "hline-tui"
version = "0.2.6"
edition = "2021"
rust-version = "1.78"
authors = ["hline contributors"]
description = "Shell history TUI for Bash, Zsh, and Fish. A Ctrl+R replacement with live filtering, favorites, and aliases. Installs as `hline`."
readme = "README.md"
license = "MIT"
repository = "https://github.com/PedroElizalde01/hline"
homepage = "https://hline.vercel.app"
documentation = "https://hline.vercel.app/docs"
keywords = ["shell", "history", "tui", "cli", "zsh"]
categories = ["command-line-utilities", "command-line-interface"]
exclude = ["/dist", "/personal", "/assets", "/.github", "/scripts", "/brag-output"]

[[bin]]
name = "hline"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0"
arboard = "3.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "=0.26.3", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.17"
