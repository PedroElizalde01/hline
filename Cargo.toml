[package]
name = "hline"
version = "0.2.0"
edition = "2021"
rust-version = "1.78"
authors = ["hline contributors"]
description = "Browse shell history with a centered cursor TUI"
readme = "README.md"
license = "MIT"
keywords = ["shell", "history", "tui", "cli"]
categories = ["command-line-utilities"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0"
arboard = "3.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "=0.26.3", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.17"
