[package]
name = "hline"
version = "0.1.3"
edition = "2021"
rust-version = "1.78"
authors = ["hline contributors"]
description = "Browse bash history with a centered cursor TUI"
readme = "README.md"
license = "MIT"
keywords = ["bash", "history", "tui", "cli"]
categories = ["command-line-utilities"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0"
arboard = "3.6"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "=0.26.3", default-features = false, features = ["crossterm"] }

[dev-dependencies]
tempfile = "3.17"
